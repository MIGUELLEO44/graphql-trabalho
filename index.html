<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Consulta GraphQL</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Consulta de Dados - GraphQL</h1>
        <p>Trabalho de Desenvolvimento de Sistemas</p>
    </header>

    <main>

        <!-- ALUNOS -->
        <section>
            <h2>Alunos</h2>

            <button id="btnAlunos">
                Carregar Alunos
            </button>

            <div id="alunos">
                <p>Clique no botão para carregar os alunos.</p>
            </div>
        </section>


        <!-- CURSOS -->
        <section>
            <h2>Cursos</h2>

            <button id="btnCursos">
                Carregar Cursos
            </button>

            <div id="cursos">
                <p>Clique no botão para carregar os cursos.</p>
            </div>
        </section>


        <!-- PROFESSORES -->
        <section>
            <h2>Professores</h2>

            <button id="btnProfessores">
                Carregar Professores
            </button>

            <div id="professores">
                <p>Clique no botão para carregar os professores.</p>
            </div>
        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
